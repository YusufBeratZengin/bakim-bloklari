name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff format check
        run: ruff format --check src tests

      - name: Run Mypy static type checker
        run: mypy src tests

      - name: Run Pytest with coverage
        run: pytest --cov=bakim_bloklari --cov-report=term-missing --cov-fail-under=85

      - name: Validate Home Assistant blueprints
        run: python -m bakim_bloklari.cli validate

      - name: Run state simulator scenarios
        run: python -m bakim_bloklari.cli simulate

      - name: Run check.sh script
        shell: bash
        run: bash scripts/check.sh
