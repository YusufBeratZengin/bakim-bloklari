blueprint:
  name: "Elderly Care - Multi-Stage Escalation Pipeline"
  description: >
    A graduated response pipeline designed to eliminate alert fatigue for families.
    Stage 1: Plays an inquiry chime or voice prompt on a local smart speaker ("Are you okay?").
    Stage 2: Waits for a local confirmation (button press or motion). Only if the resident does
    not answer, sends a polite push notification to the resident's mobile phone and waits again.
    Stage 3: If still unacknowledged after the second window, escalates to a high-priority
    critical alarm to designated family members and caregivers.
    Acknowledgement at any stage stops the pipeline, so caregivers are never paged when the
    resident already answered.

    TR: Kademeli acil durum hattı. Önce evdeki hoparlörden "İyi misiniz?" uyarısı verilir,
    ardından yerel onay beklenir. Onay gelmezse yaşlının telefonuna nazik bir bildirim gönderilir
    ve yeniden beklenir. Hâlâ onay yoksa bakıcıya kritik alarm iletilir. Herhangi bir aşamadaki
    onay sonraki aşamaları durdurur; gereksiz uyarı yorgunluğu oluşmaz.
  domain: automation
  input:
    trigger_boolean:
      name: Trigger Entity
      description: Input boolean or alert entity that activates this escalation pipeline.
      selector:
        entity:
          domain: [input_boolean, alert]
    ack_entity:
      name: Acknowledgment Button / Switch (Optional)
      description: Button or boolean the resident can press to acknowledge and cancel the alert.
      default: ""
      selector:
        entity:
          domain: [input_boolean, binary_sensor, event]
    wait_resident_minutes:
      name: Resident Response Window (Minutes)
      description: Minutes to wait for resident response before alerting family.
      default: 5
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: minutes
          mode: box
    speaker_action:
      name: Stage 1 - Local Speaker Action (Optional)
      description: Action to play a local chime or voice prompt inside the home.
      default: []
      selector:
        action: {}
    resident_notify_action:
      name: Stage 2 - Resident Phone Notification (Optional)
      description: Action to send a soft notification to the resident's device.
      default: []
      selector:
        action: {}
    caregiver_notify_action:
      name: Stage 3 - Caregiver Critical Alarm Action
      description: Urgent action executed if no acknowledgment is received.
      selector:
        action: {}

variables:
  trigger_boolean_var: !input trigger_boolean
  ack_entity_var: !input ack_entity

mode: restart

trigger:
  - platform: state
    entity_id: !input trigger_boolean
    to: "on"

condition:
  # Ensure trigger entity is valid
  - condition: template
    value_template: >-
      {% set ent = trigger_boolean_var %}
      {{ not is_state(ent, 'unavailable') and not is_state(ent, 'unknown') }}

action:
  # Stage 1: local speaker prompt ("Are you okay?")
  - choose: []
    default: !input speaker_action

  # Stage 2a: wait for the resident's local acknowledgement
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {% set ack = ack_entity_var %}
              {{ ack is defined and ack != '' }}
        sequence:
          - wait_for_trigger:
              - platform: template
                value_template: >-
                  {% set ack = ack_entity_var %}
                  {{ ack and is_state(ack, 'on') }}
            timeout:
              minutes: !input wait_resident_minutes
            continue_on_timeout: true
    default:
      - delay:
          minutes: !input wait_resident_minutes

  # Stage 2b: only if the resident has not answered, ping their phone and wait again
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {% set ack = ack_entity_var %}
              {{ not (ack and ack != '' and is_state(ack, 'on')) }}
        sequence:
          - choose: []
            default: !input resident_notify_action
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {% set ack = ack_entity_var %}
                      {{ ack is defined and ack != '' }}
                sequence:
                  - wait_for_trigger:
                      - platform: template
                        value_template: >-
                          {% set ack = ack_entity_var %}
                          {{ ack and is_state(ack, 'on') }}
                    timeout:
                      minutes: !input wait_resident_minutes
                    continue_on_timeout: true
            default:
              - delay:
                  minutes: !input wait_resident_minutes

          # Stage 3: still no acknowledgement -> critical caregiver alarm
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {% set ack = ack_entity_var %}
                      {{ not (ack and ack != '' and is_state(ack, 'on')) }}
                sequence: !input caregiver_notify_action
